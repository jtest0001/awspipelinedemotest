version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing packages...
      - npm ci

  build:
    commands:
      - echo Running tests...
      - npm run test

      - echo Building app...
      - npm run build

  post_build:
    commands:
      - aws cloudfront create-invalidation --distribution-id ETNZHWJMVWPQA --paths "/*"

artifacts:
  base-directory: dist
  files:
    - "**/*"
