version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install

  build:
    commands:
      - npm run build

  post_build:
    commands:
      - aws cloudfront create-invalidation --distribution-id ETNZHWJMVWPQA --paths "/*"

artifacts:
  base-directory: dist
  files:
    - "**/*"
