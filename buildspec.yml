version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing packages...
      - npm ci

  build:
    commands:
      - npm run test
      - npm run build
      - aws cloudfront create-invalidation --distribution-id ETNZHWJMVWPQA --paths "/*"

artifacts:
  base-directory: dist
  files:
    - "**/*"
